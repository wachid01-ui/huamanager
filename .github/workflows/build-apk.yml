name: Build Android Release AAB & APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Prepare Signing Keystore
        env:
          SECRET_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${STORE_PASS:-ryota1116}"
          KEY_PASS="${KEY_PASS:-ryota1116}"
          if [ -n "$SECRET_KEYSTORE" ]; then
            echo "Using keystore from repository secrets..."
            echo "$SECRET_KEYSTORE" | base64 --decode > huamanager-release.jks
          else
            echo "Using fallback release keystore generation..."
            keytool -genkeypair \
              -v \
              -keystore huamanager-release.jks \
              -alias huamanager \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=HuaManager, OU=RyotaStudio, O=RyotaStudio, L=Mojokerto, ST=East Java, C=ID"
          fi

      - name: Build Signed Release AAB, Release APK & Debug APK
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          export RELEASE_STORE_FILE="${GITHUB_WORKSPACE}/huamanager-release.jks"
          export RELEASE_STORE_PASSWORD="${STORE_PASS:-ryota1116}"
          export RELEASE_KEY_ALIAS="${KEY_ALIAS_SECRET:-huamanager}"
          export RELEASE_KEY_PASSWORD="${KEY_PASS:-ryota1116}"
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace 2>&1 | tee gradle_build.log

      - name: Publish Build Error Details
        if: failure()
        run: |
          echo "## ❌ Build Error Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Signed AAB (for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: HuaManager-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HuaManager-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HuaManager-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v1.0.0-release-$(date +'%Y%m%d-%H%M%S')"
          echo "Creating Release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/debug/*.apk \
            --title "HuaManager Play Store Release ($RELEASE_TAG)" \
            --notes "### 🚀 Paket Rilis HuaManager (Google Play Ready)
- **HuaManager Release AAB (.aab):** File resmi siap upload ke Google Play Console (Internal / Closed Testing / Production).
- **HuaManager Release APK (.apk):** APK rilis bertanda tangan resmi untuk pengujian di HP Android.
- **HuaManager Debug APK (.apk):** APK debug dengan log lengkap untuk pengembang." \
            || echo "Release creation skipped or already exists."
